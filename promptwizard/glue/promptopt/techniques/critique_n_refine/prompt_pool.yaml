system_prompt: Jesteś pomocnym asystentem stworzonym przez OpenAI, który potrafi efektywnie wykonywać zadania zgodnie z instrukcją

expert_profile: Jesteś pomocnym asystentem stworzonym przez OpenAI, który potrafi efektywnie wykonywać zadania zgodnie z instrukcją

thinking_styles:
  - "Jak mógłbym opracować eksperyment, który pomoże rozwiązać ten problem?"
  - "Sporządź listę pomysłów na rozwiązanie tego problemu i zastosuj je jeden po drugim, aby sprawdzić, czy można osiągnąć jakiś postęp".
  - "Jak mogę zmierzyć postęp w rozwiązywaniu tego problemu?"
  - "Jak mogę uprościć problem, aby łatwiej było go rozwiązać?"
  - "Jakie są główne założenia leżące u podstaw tego problemu?"
  - "Jakie są potencjalne ryzyka i wady każdego rozwiązania?"
  - "Jakie są alternatywne perspektywy lub punkty widzenia na ten problem?"
  - "Jakie są długoterminowe skutki tego problemu i jego rozwiązania?"
  - "Jak mogę podzielić ten problem na mniejsze, łatwiejsze do opanowania części?"
  - "Myślenie krytyczne: Ten styl obejmuje analizę problemu z różnych perspektyw, kwestionowanie założeń i ocenę dostępnych dowodów lub informacji. Skupia się na logicznym rozumowaniu, podejmowaniu decyzji w oparciu o dowody i identyfikowaniu potencjalnych uprzedzeń lub wad w myśleniu."
  - "Spróbuj kreatywnego myślenia, generuj innowacyjne i nieszablonowe pomysły, aby rozwiązać problem. Odkryj niekonwencjonalne rozwiązania, myśl poza tradycyjnymi granicami i zachęcaj do wyobraźni i oryginalności."
  - "Poproś innych o wkład i współpracę, aby rozwiązać problem. Kładź nacisk na pracę zespołową, otwartą komunikację i wykorzystanie różnorodnych perspektyw i wiedzy grupy, aby znaleźć skuteczne rozwiązania."
  - "Użyj myślenia systemowego: Rozważ problem jako część większego systemu i zrozum powiązania różnych elementów. Skupia się na identyfikacji przyczyn leżących u podstaw, pętli sprzężenia zwrotnego i współzależności, które wpływają na problem, oraz opracowuje holistyczne rozwiązania, które dotyczą systemu jako całości."
  - "Użyj analizy ryzyka: Oceń potencjalne ryzyka, niepewności i kompromisy związane z różnymi rozwiązaniami lub podejściami do problemu. Połóż nacisk na ocenę potencjalnych konsekwencji i prawdopodobieństwa sukcesu lub porażki oraz podejmowanie świadomych decyzji w oparciu o zrównoważoną analizę ryzyka i korzyści."
  - "Stosuj myślenie refleksyjne: Odejdź od problemu, poświęć czas na introspekcję i autorefleksję. Zbadaj osobiste uprzedzenia, założenia i modele mentalne, które mogą wpływać na rozwiązywanie problemów, i bądź otwarty na naukę z przeszłych doświadczeń, aby ulepszyć przyszłe podejścia."
  - "Jaki jest główny problem, który należy rozwiązać?"
  - "Jakie są podstawowe przyczyny lub czynniki przyczyniające się do problemu?"
  - "Czy istnieją jakieś potencjalne rozwiązania lub strategie, które zostały już wypróbowane? Jeśli tak, jakie były wyniki i wyciągnięte wnioski?"
  - "Jakie potencjalne przeszkody lub wyzwania mogą pojawić się na drodze do rozwiązania tego problemu?"
  - "Czy istnieją jakieś istotne dane lub informacje, które mogą dać wgląd w problem? Jeśli tak, jakie źródła danych są dostępne i jak można je analizować?"
  - "Czy są jacyś interesariusze lub osoby, których problem bezpośrednio dotyczy? Jakie są ich perspektywy i potrzeby?"
  - "Jakie zasoby (finansowe, ludzkie, technologiczne itp.) są potrzebne, aby skutecznie rozwiązać ten problem?"
  - "W jaki sposób można mierzyć lub oceniać postęp lub sukces w rozwiązywaniu problemu?"
  - "Jakie wskaźniki lub metryki można wykorzystać?"
  - "Czy problem jest techniczny czy praktyczny i wymaga określonej wiedzy specjalistycznej lub zestawu umiejętności? Czy jest to raczej problem koncepcyjny lub teoretyczny?"
  - "Czy problem wiąże się z ograniczeniem fizycznym, np. ograniczonymi zasobami, infrastrukturą lub przestrzenią?"
  - "Czy problem jest związany z zachowaniem człowieka i ma charakter społeczny, kulturowy lub psychologiczny?"
  - "Czy problem dotyczy podejmowania decyzji lub planowania, gdzie wybory trzeba podejmować w warunkach niepewności lub w obliczu sprzecznych celów?"
  - "Czy problem ma charakter analityczny i wymaga analizy danych, modelowania lub technik optymalizacji?"
  - "Czy problem jest wyzwaniem projektowym wymagającym kreatywnych rozwiązań i innowacji?"
  - "Czy problem wymaga zajęcia się kwestiami systemowymi lub strukturalnymi, a nie tylko konkretnymi przypadkami?"
  - "Czy problem jest pilny i wymaga natychmiastowej uwagi i działania?"
  - "Jakiego rodzaju rozwiązania są zazwyczaj opracowywane dla tego rodzaju specyfikacji problemu?"
  - "Biorąc pod uwagę specyfikację problemu i najlepsze obecnie rozwiązanie, spróbuj wyobrazić sobie inne możliwe rozwiązania."
  - "Wyobraźmy sobie, że najlepsze rozwiązanie jest całkowicie błędne. W jaki inny sposób można pomyśleć o specyfikacji problemu?"
  - "Jaki jest najlepszy sposób na modyfikację tego obecnie najlepszego rozwiązania, biorąc pod uwagę Twoją wiedzę na temat tego rodzaju specyfikacji problemów?"
  - "Ignorując najlepsze obecnie rozwiązanie, stwórz całkowicie nowe rozwiązanie problemu."
  - "Pomyślmy krok po kroku."
  - "Przygotujmy plan krok po kroku i wdróżmy go w życie, mając dobry pomysł i wyjaśnienie."


# ans_delimiter_instruction: " Wrap only your final answer, without reason for each question separately between <ANS_START> and <ANS_END> tags."
ans_delimiter_instruction: ""

meta_critique_template: |
  I'm trying to write a zero-shot instruction that will help the most capable and suitable agent to solve the task.
  My current prompt is: "{instruction}"
  But this prompt gets the following examples wrong: {examples}
  Provide detail feedback which identifies reasons where the instruction could have gone wrong.
  Wrap each reason with <START> and <END>
  

meta_positive_critique_template: |
  I'm trying to write a prompt for zero-shot instruction task that will help the most capable and suitable agent to solve the task.
  My current prompt is:
  [CURRENT PROMPT] "{instruction}"
  Now this prompt got the following examples correct:
  [CORRECT EXAMPLES] {examples}
  Since you cant use these examples, analyse and understand characteristics/complexity and diversity of these examples and their reasoning chain and
  accordingly provide suggestions to further improve the prompt and make it better as a zero shot instruction task.
    

critique_refine_template: |
  I'm trying to write a zero-shot instruction that will help the most capable and suitable agent to solve the task.
  My current prompt is: "{instruction}"
  But this prompt gets the following examples wrong: {examples}
  On carefully analysing these examples, following are the critiques related to prompt {critique}
  Use the critique smartly, refine the current prompt to make sure we dont get these examples wrong.
  Based on the above information, Now I want you to write {steps_per_sample} different improved prompts.
  Each prompt should be wrapped with <START> and <END>.
  [Refined Prompts]:


