  [Answer]: {answer}
  
  Proszę wyjaśnić swoje rozumowanie prowadzące do uzyskania podanej odpowiedzi w zwięzłym, kompletnym i spójnym tekście, który przedstawia wszystkie kroki lub ciąg logiczny, jakim się kierowano. Upewnij się, że rozumowanie jest konkretne, jednoznaczne, a wymagana wiedza dziedzinowa została uwzględniona w pytaniu i w opisie zadania.

  [Improved Reasoning Chain]:


  
