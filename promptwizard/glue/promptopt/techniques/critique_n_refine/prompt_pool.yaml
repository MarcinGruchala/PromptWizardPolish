meta_critique_template: |
  Próbuję napisać instrukcję zero-shot, która pomoże najbardziej kompetentnemu i odpowiedniemu agentowi w rozwiązaniu zadania.
  Moja obecna instrukcja brzmi: "{instruction}"
  Jednak ta instrukcja błędnie rozwiązuje następujące przykłady: {examples}
  Podaj szczegółową informację zwrotną, która zidentyfikuje powody, dla których ta instrukcja mogła się nie sprawdzić.
  Otocz każdy powód znacznikami <START> i <END>
  

meta_positive_critique_template: | 
  Próbuję napisać polecenie (prompt) do zadania zero-shot instruction, które pomoże najbardziej kompetentnemu i odpowiedniemu agentowi w rozwiązaniu zadania.
  Moje aktualne polecenie brzmi: [AKTUALNY PROMPT] "{instruction}"
  To polecenie poprawnie poradziło sobie z następującymi przykładami: [POPRAWNE PRZYKŁADY] {examples}
  Ponieważ nie możesz skorzystać z tych przykładów, przeanalizuj i zrozum ich cechy, poziom złożoności, różnorodność oraz ciąg rozumowania.
  Na tej podstawie zaproponuj sugestie, jak jeszcze ulepszyć to polecenie, aby stało się lepsze dla zadania w stylu zero-shot instruction.
    

critique_refine_template: |
  Próbuję napisać instrukcję zero-shot, która pomoże najbardziej kompetentnemu i odpowiedniemu agentowi w rozwiązaniu zadania.
  Moja obecna instrukcja brzmi: "{instruction}"
  Jednak ta instrukcja błędnie rozwiązuje następujące przykłady: {examples}
  Po dokładnej analizie tych przykładów, poniżej znajdują się uwagi dotyczące instrukcji: {critique}
  Wykorzystaj te uwagi w przemyślany sposób i ulepsz aktualną instrukcję, aby upewnić się, że nie będzie błędnych wyników w tych przykładach.
  Na podstawie powyższych informacji, teraz chciałbym, abyś napisał {steps_per_sample} różnych ulepszonych instrukcji.
  Każdą instrukcję należy umieścić w znacznikach <START> i <END>.
  [Ulepszone Instrukcje]:



