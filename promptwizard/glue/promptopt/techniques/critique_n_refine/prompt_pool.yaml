meta_sample_template: |
  Otrzymujesz opis zadania oraz instrukcję (prompt) i różne style, nazywane meta promptami:
  [Opis Zadania]: {task_description}
  [Meta Prompt]: {meta_prompts}
  Teraz musisz wygenerować {num_variations} wariantów następującej instrukcji, adaptacyjnie łącząc meta prompt przy zachowaniu podobnego znaczenia semantycznego.
  Upewnij się, że każda wygenerowana instrukcja jest otoczona znacznikami <START> i <END>
  [Instrukcja (Prompt)]: {prompt_instruction}
  [Wygenerowane Instrukcje]:



intent_template: |
  Otrzymujesz instrukcję oraz opis zadania oznaczony jako [Task Description]. Dla podanej instrukcji wypisz 3-5 słów kluczowych w formacie rozdzielanym przecinkami jako [Intent]. Słowa te powinny opisywać cechy lub właściwości, które są wymagane od najbardziej kompetentnego i odpowiedniego agenta do rozwiązania zadania przy użyciu tej instrukcji.

  [Task Description]: {task_description}
  [Instruction]: {instruction}
  
  [Intent]:



expert_template: |
  Dla każdej instrukcji napisz wysokiej jakości opis najbardziej kompetentnego i odpowiedniego agenta, który będzie odpowiadał na daną instrukcję. Użyj formy drugiej osoby.


  [Instruction]: Make a list of 5 possible effects of deforestation.
  [Agent Description]: Jesteś naukowcem zajmującym się ochroną środowiska, specjalizującym się w badaniu ekosystemów oraz ich interakcji z działalnością człowieka. Posiadasz rozległą wiedzę na temat wpływu wylesiania na środowisko, w tym na różnorodność biologiczną, zmiany klimatyczne, jakość gleby, zasoby wodne i zdrowie ludzi. Twoja praca jest szeroko uznawana i przyczyniła się do tworzenia polityk oraz regulacji mających na celu promowanie zrównoważonych praktyk zarządzania lasami. Dysponujesz najnowszymi wynikami badań, dzięki którym możesz przygotować szczegółową i wyczerpującą listę możliwych skutków wylesiania, w tym między innymi utratę siedlisk dla niezliczonych gatunków, zwiększoną emisję gazów cieplarnianych, pogorszenie jakości i ograniczenie ilości wody, erozję gleby oraz pojawianie się chorób. Twoja wiedza i wgląd są niezwykle cenne w zrozumieniu złożonych interakcji między działalnością człowieka a środowiskiem.


  [Instruction]: Identify a descriptive phrase for an eclipse.
  [Agent Description]: Jesteś astronomem z głęboką wiedzą na temat zjawisk i procesów zachodzących w kosmosie. Twoje rozległe umiejętności i doświadczenie czynią Cię ekspertem w opisywaniu unikatowych i fascynujących cech zaćmień. Na przestrzeni swojej kariery obserwowałeś i badałeś wiele zaćmień, zyskując wyjątkową wrażliwość na detale i niuanse. Potrafisz stworzyć barwną, poetycką i jednocześnie naukowo precyzyjną frazę opisującą zaćmienie. Jesteś w stanie uchwycić zapierające dech w piersiach piękno tego zjawiska, jednocześnie wyjaśniając leżące u jego podstaw mechanizmy naukowe. Dzięki swojej wszechstronnej wiedzy o astronomii – obejmującej ruch Słońca, Księżyca i Ziemi – możesz sformułować frazę, która trafnie i elegancko oddaje istotę zaćmienia. Twoje spostrzeżenia pomogą innym docenić niezwykłość tego naturalnego fenomenu.


  [Instruction]: Identify the parts of speech in this sentence: "The dog barked at the postman".
  [Agent Description]: Jesteś językoznawcą doskonale zorientowanym w strukturze języka. Masz wyostrzoną umiejętność rozpoznawania części mowy i łatwo określasz funkcję każdego słowa w zdaniu. Znasz doskonale zasady gramatyki i potrafisz odróżnić rzeczowniki, czasowniki, przymiotniki, przysłówki, zaimki, przyimki oraz spójniki. Bez trudu i z najwyższą precyzją zidentyfikujesz części mowy w zdaniu „The dog barked at the postman” i wyjaśnisz rolę każdego wyrazu. Twoje doświadczenie w dziedzinie języka i gramatyki jest nieocenione w analizie i zrozumieniu niuansów komunikacji.


  [Instruction]: {task_description}
  [Agent Description]:



examples_critique_template: |
  Jesteś ekspertem w zakresie wybierania przykładów in-context, który może pomóc w doborze właściwych przykładów, aby najbardziej odpowiedni agent mógł rozwiązać ten problem.
  Otrzymujesz również polecenie (prompt), które jest wykorzystywane do rozwiązania tego zadania:
  [Prompt]: {prompt}

  Poniżej przedstawiono opis zadania:
  [Task Description]: {task_description}

  Próbuję napisać „few-shot prompt”, używając {num_examples} przykładów in-context, aby skutecznie rozwiązywać dowolne pytania związane z powyższym zadaniem.
  Moje obecne {num_examples} przykłady in-context to: {examples}

  Zastanów się nad analizą, zrozumieniem i tworzeniem przykładów zadania w oparciu o kryteria różnorodności typów przykładów, złożoności natury/charakterystyki przykładów oraz ich ogólnej spójności i kompatybilności w obrębie całego zestawu.

  Wypisz wszystkie sugestie i ulepszenia, jakie można wprowadzić w odniesieniu do każdego indywidualnego przykładu w całym zestawie wybranych przykładów.


examples_critique_template_zero_shot: |
  Jesteś ekspertem w zakresie wybierania odpowiednich przykładów in-context, który może pomóc w doborze właściwych przykładów, aby najbardziej odpowiedni agent mógł rozwiązać dany problem.
  Otrzymujesz również polecenie (prompt), które jest wykorzystywane do rozwiązania tego zadania:
  [Prompt]: {prompt}

  Poniżej przedstawiono opis zadania:
  [Task Description]: {task_description}

  Próbuję napisać kilka przykładów (few-shot prompt) używając {num_examples} przykładów in-context, aby skutecznie rozwiązywać dowolne pytania związane z powyższym zadaniem.

  Zastanów się nad analizą, zrozumieniem i tworzeniem przykładów zadania w oparciu o kryteria różnorodności typów przykładów, złożoności ich natury/charakterystyki oraz ich ogólnej spójności i kompatybilności w obrębie całego zestawu.

  Przedstaw wszystkie sugestie i ulepszenia, jakie można wprowadzić w odniesieniu do każdego z wybranych przykładów, aby poprawić cały zestaw.


examples_optimization_template: |
  Jesteś ekspertem w zakresie dobierania odpowiednich przykładów in-context, który może pomóc agentowi rozwiązać to zadanie.
  Otrzymujesz również polecenie (prompt), które służy do rozwiązania tego zadania:
  [Prompt]: {prompt}

  Oto opis zadania:
  [Task Description]: {task_description}

  Próbuję napisać few-shot prompt używając {num_examples} przykładów in-context, aby skutecznie rozwiązywać wszelkie pytania związane z powyższym zadaniem.
  Moje obecne {num_examples} przykłady in-context to: {examples}

  Otrzymujesz również zestaw sugestii/ulepszeń, które można wprowadzić do każdego z wybranych przykładów, aby poprawić cały zestaw przykładów:
  [SUGGESTION/IMPROVEMENT]: {critique}

  Wykorzystaj tę wiedzę w przemyślany sposób, aby starannie stworzyć nowy zestaw {num_examples}, który będzie uwzględniał powyższe sugestie i ulepszenia.
  Upewnij się, że każdy przykład jest otoczony znacznikami <START> i <END>.

  Nowe przykłady powinny ściśle przestrzegać poniższego formatu:

  [Question] po którym następuje część pytania w przykładzie
  [Answer] po którym następują wszystkie kroki logicznego rozumowania związane z odpowiedzią. Końcowa odpowiedź w postaci: "<ANS_START>[answer]<ANS_END>"

  Na przykład:
  <START>
  {gt_example}
  <END>

  [New Examples]:



generate_reason_template: |
  Otrzymujesz opis zadania i instrukcję, a także zestaw poprawnych przykładów dotyczących tego zadania.
  
  [Task Description]: {task_description}
  
  [Instruction]: {instruction}
  
  Każdy przykład ma pytanie oznaczone jako [Question] oraz finalną odpowiedź [Answer].
  
  [Question]: {question}
  
  [Answer]: {answer}
  
  Twoim zadaniem jest wygenerowanie ciągu rozumowania, który zawiera kroki i tok logiczny prowadzący do uzyskania poprawnej odpowiedzi, przy założeniu, że niezbędna wiedza dziedzinowa została uwzględniona w treści pytania oraz opisie zadania.
  
  Upewnij się, że jest on konkretny, jednoznaczny, kompletny oraz wyraźnie wskazuje całą logikę i kolejne kroki niezbędne do osiągnięcia ostatecznej odpowiedzi.
  
  [Improved Reasoning Chain]:



